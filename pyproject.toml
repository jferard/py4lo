[tool.black]
line-length = 79
diff = true

[tool.mypy]
exclude = ["target", "megalinter-reports", "venv", "test"]

[tool.pyright]
reportMissingImports = false
exclude = ["**/target", "megalinter-reports", "venv", "test"]

[tool.bandit]
skips = ["B311", "B314", "B405", "B318", "B408"]
exclude_dirs = ["./megalinter-reports", "./venv", "./examples/csv/target", "./examples/html/target", "./examples/message/target", "./examples/quickstart/qs/target", "./examples/sqlite3/target"]

[tool.isort]
profile = "black"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".venv",
]

line-length = 79
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "SIM117",
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
docstring-code-line-length = "dynamic"